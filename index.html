<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="A simple dark mode calculator that shows the percentage each value represents of the total.">
  <title>Percentages</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📊%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Percentages</h1>
      <p>Type your values and see how much each one weighs on the total.</p>
    </header>

    <div class="layout" id="layout">
      <section class="panel inputs" aria-label="Values">
        <ul class="rows" id="rows"></ul>
        <div class="actions">
          <button class="btn btn-primary" id="add" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            <span>Add field</span>
          </button>
          <button class="btn btn-ghost" id="reset" type="button">Clear values</button>
        </div>
      </section>

      <aside class="panel summary" aria-label="Summary">
        <div class="chart">
          <svg viewBox="0 0 200 200" role="img" aria-label="Donut chart of the percentages">
            <circle class="track" cx="100" cy="100" r="80"></circle>
            <g id="segments"></g>
          </svg>
          <div class="center" aria-live="polite">
            <span class="center-label" id="center-label">Total</span>
            <span class="center-value" id="center-value">0</span>
          </div>
        </div>

        <div class="stack" id="stack" aria-hidden="true"></div>

        <dl class="stats">
          <div class="stat"><dt>Total</dt><dd id="stat-total">0</dd></div>
          <div class="stat"><dt>Fields</dt><dd id="stat-count">0</dd></div>
          <div class="stat"><dt>Largest</dt><dd id="stat-top">—</dd></div>
        </dl>
      </aside>
    </div>

    <footer class="footer">Everything runs in your browser. Nothing is sent anywhere.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
